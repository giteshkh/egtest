userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
framework: mstest

platforms:
  - platformName: android
    platformVersion: "15.0"
    deviceName: Samsung Galaxy S25
    app: ${BS_APP_HASH}
  - platformName: android
    platformVersion: "16.0"
    deviceName: Samsung Galaxy Tab S11
    app: ${BS_APP_HASH}

parallelsPerPlatform: 1

projectName: "Front Systems"
buildName: "build-${BS_BUILD_NAME}"
buildIdentifier: ${BS_BUILD_NAME}

debug: true
networkLogs: true
appProfiling: true

testObservability: true
browserstackAutomation: true
selfHeal: true

testOrchestrationOptions:
  retryTestsOnFailure:
    enabled: true
    maxRetries: 2
  abortBuildOnFailure:
    enabled: true
    maxFailures: 5
  runSmartSelection:
    enabled: true
    mode: relevantFirst
  runPreviouslyFailedFirst: true
  rerunPreviouslyFailed: true
